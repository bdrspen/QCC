<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCC | Q8 Car Customs</title>
    <!-- Google Fonts: Inter for clean UI, Playfair Display for Classical Elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DARK THEME (Default / Night) --- */
        :root {
            --bg-color: #0c0d10;
            --card-bg: rgba(20, 21, 26, 0.85);
            --border-color: rgba(212, 175, 55, 0.2);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --btn-bg: rgba(255, 255, 255, 0.02);
            --btn-hover-bg: rgba(212, 175, 55, 0.05);
            --shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            --radial-glow: radial-gradient(circle at 50% 20%, rgba(30, 27, 15, 0.4) 0%, transparent 60%);
        }

        /* --- LIGHT THEME (Daytime) --- */
        [data-theme="light"] {
            --bg-color: #f7f4ed;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(184, 151, 40, 0.3);
            --gold: #b89728;
            --gold-light: #8c711a;
            --gold-glow: rgba(184, 151, 40, 0.15);
            --text-main: #2c2a29;
            --text-muted: #6b655f;
            --btn-bg: rgba(0, 0, 0, 0.02);
            --btn-hover-bg: rgba(184, 151, 40, 0.08);
            --shadow: 0 20px 40px rgba(184, 151, 40, 0.12);
            --radial-glow: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
            background-image: 
                var(--radial-glow),
                linear-gradient(rgba(150, 150, 150, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(150, 150, 150, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .container {
            max-width: 520px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(212, 175, 55, 0.1);
            animation: fadeIn 1s ease-out;
            transform-style: preserve-3d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            background: linear-gradient(135deg, var(--gold-light) 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-divider {
            width: 80px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .coming-soon {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px var(--gold-glow);
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn i {
            font-size: 1.2rem;
            color: var(--gold);
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-2px);
        }

        .footer-info {
            margin-top: 35px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <script>
        // Automatic Theme Switcher based on local time
        // Sets light theme between 6:00 AM (06:00) and 6:00 PM (18:00)
        const currentHour = new Date().getHours();
        if (currentHour >= 6 && currentHour < 18) {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <div class="container">
        <img src="qcc-logo.png" alt="QCC Logo" class="logo" onerror="this.style.display='none'">
        <h1>QCC</h1>
        <div class="gold-divider"><img src="https://flagcdn.com/w40/kw.png" alt="Kuwait Flag" style="height: 20px; display: block; margin: 10px auto 0 auto;"></div>
        
        <div class="coming-soon">" your car , your design "</div>

        <div class="links-grid">
            <a href="https://www.instagram.com/q8carcustoms" class="btn" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
                <span>Instagram &bull; <strong>@q8carcustoms</strong></span>
            </a>
            <a href="https://www.tiktok.com/@q8carcustoms" class="btn" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-tiktok"></i>
                <span>TikTok &bull; <strong>@q8carcustoms</strong></span>
            </a>
        </div>

        <div class="footer-info">
            Kuwait | Precision Automotive Art | 2026-2027
        </div>
    </div>

    <script>
        // Subtle classical interactive tilt effect
        const container = document.querySelector('.container');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform = `rotateY(0deg) rotateX(0deg)`;
            container.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            container.style.transition = 'none';
        });
    </script>
</body>
</html>
